name_context_1: "Context1"
name_context_2: "Context2"
run_type: "file"
data_type: "simulation"
out_dir: "/nfs/data/DyHealthNet/moDiNA_data/balanced_background/n100/"

simulation:
  n_simulations: 5
  n_bi: 100
  n_cont: 100
  n_cat: 100
  n_samples_1: 100
  n_samples_2: 100
  n_shift_cont: 5
  n_shift_bi: 5
  n_shift_cat: 5
  n_corr_cont_cont: 3
  n_corr_bi_bi: 3
  n_corr_cat_cat: 3
  n_corr_bi_cont: 3
  n_corr_bi_cat: 3
  n_corr_cont_cat: 3
  n_both_cont_cont: 3
  n_both_bi_bi: 3
  n_both_cat_cat: 3
  n_both_bi_cont: 3
  n_both_bi_cat: 3
  n_both_cont_cat: 3

  # Each ground truth node/edge draws its own magnitude uniformly from these
  # ranges, so one run spans weak to strong effects and yields a detection curve
  # rather than a single operating point. Set low == high for a fixed magnitude.
  corr_low: 0.1
  corr_high: 0.4
  shift_low: 0.2
  shift_high: 0.8
  hub_reuse_prob: 0.5

  # Shared background correlation structure, identical in both contexts.
  background_topology: "scale_free"   # or "erdos_renyi" (no hubs, same edge count)
  background_strength: 0.1            # target mean |r| over the directly wired pairs
  background_density: 2               # connections each node makes when added
  background_seed: 1000               # offset by the replicate id, so each replicate
                                      # gets its own background, reproducibly

  # Marginal shapes. Base rates far from 0.5, or near-empty categories, cap the
  # attainable association and would attenuate any edge touching such a node
  # regardless of its drawn magnitude.
  binary_p_low: 0.3
  binary_p_high: 0.7
  ordinal_concentration: 20.0

diff_net_analysis:
  path_config: "/nfs/proj/l.arend/DyHealthNet/modina/moDiNA_nf_pipeline/params_files/simulation/balanced_background/balanced_background_samplesheet.csv"
  max_path_length: 2
  test_type: "parametric"
  multiple_testing: "bh"
