# HANCOCK, HPV status: p16-negative vs. p16-positive oropharyngeal carcinomas.
# Context files are created by hancock_scripts/context_creation.py (see hancock_scripts/README.md).
# Run from moDiNA_nf_pipeline/:
#   nextflow run main.nf -profile conda,slurm -params-file params_files/hancock/hancock_hpv.yml

name_context_1: "HPV-negative"
name_context_2: "HPV-positive"
run_type: "file"            # run the configurations listed in diff_net_analysis.path_config
data_type: "real"
out_dir: "/nfs/data/DyHealthNet/moDiNA_data/hancock/hancock_processed_data/hpv_association_p16_json/"
work_dir: "./work"
evaluation: false           # no ground truth for real data

real_world_data:
  path_context_1: "/nfs/data/DyHealthNet/moDiNA_data/hancock/hancock_processed_data/hpv_association_p16_json/hpv_association_p16_0.csv"
  path_context_2: "/nfs/data/DyHealthNet/moDiNA_data/hancock/hancock_processed_data/hpv_association_p16_json/hpv_association_p16_2.csv"
  path_meta: "/nfs/data/DyHealthNet/moDiNA_data/hancock/hancock_processed_data/hpv_association_p16_json/hpv_association_p16_metadata.csv"

diff_net_analysis:
  # Configurations to run: the ten best configurations of the simulation benchmark
  path_config: "top_10_configs_on_sim_samplesheet.csv"
  # Not used: only read when run_type is "single"
  node_metric: ""
  edge_metric: ""
  ranking_algorithm: ""
  pagerank_damping: 0.85
  # Context network inference
  test_type: "nonparametric"  # tests for continuous variables; the benchmark used "parametric"
  multiple_testing: "bh"      # Benjamini-Hochberg
  nan_value: -99              # missing-value code of the HANCOCK data
  n_min_valid: 10             # minimum complete samples per pairwise test
  # Edge filtering: disabled (filter_target empty); the other filter parameters are then not used
  filter_target: ""
  filter_method: ""
  filter_param: ""
  filter_metric: ""
  filter_rule: ""
